# Configuración para despliegue en Netlify de Fichas ATM (Página de descarga offline)
[build]
  publish = "netlify"

[[redirects]]
  from = "/descargar"
  to = "https://github.com/kinesoftware/fichas-atm/archive/refs/heads/main.zip"
  status = 302

[[redirects]]
  from = "/repo"
  to = "https://github.com/kinesoftware/fichas-atm"
  status = 302
